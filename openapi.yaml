openapi: 3.1.0
info:
  title: Materiality Calculator TEST API
  version: 1.0.0

paths:
  /calculation-request:
    post:
      summary: Submit a calculation request
      operationId: submitCalculationRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - messageType
                - version
                - salesforceCallMeta
                - lines
              properties:
                messageType:
                  type: string
                  const: calculationRequest
                version:
                  type: string
                salesforceCallMeta:
                  type: object
                  additionalProperties: false
                  required:
                    - SFCalculatorId
                    - mpanCore
                    - sentAt
                    - totalLines
                  properties:
                    SFCalculatorId:
                      type: string
                    mpanCore:
                      type: string
                    sentAt:
                      type: string
                      format: date-time
                    totalLines:
                      type: integer
                      minimum: 0
                lines:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required:
                      - lineNumber
                      - date
                      - values
                    properties:
                      lineNumber:
                        type: integer
                        minimum: 1
                      date:
                        type: string
                        format: date
                      values:
                        type: array
                        items:
                          type: number
            example:
              messageType: calculationRequest
              version: "1.0"
              salesforceCallMeta:
                SFCalculatorId: SF-12345
                mpanCore: "1234567890123"
                sentAt: "2026-06-30T15:00:00Z"
                totalLines: 2
              lines:
                - lineNumber: 1
                  date: "2026-06-30"
                  values: [1, 2, 3, 4]
                - lineNumber: 2
                  date: "2026-07-01"
                  values: [5, 6, 7, 8]
      responses:
        "200":
          description: Calculation request accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - receivedAt
                  - requestId
                  - SFCalculatorId
                  - mpanCore
                  - totalLines
                properties:
                  receivedAt:
                    type: string
                    format: date-time
                  requestId:
                    type: string
                  SFCalculatorId:
                    type: string
                  mpanCore:
                    type: string
                  totalLines:
                    type: integer
                    minimum: 0
              example:
                receivedAt: "2026-06-30T15:01:00Z"
                requestId: req_123456
                SFCalculatorId: SF-12345
                mpanCore: "1234567890123"
                totalLines: 2
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - receivedAt
                  - requestId
                  - SFCalculatorId
                  - errors
                properties:
                  receivedAt:
                    type: string
                    format: date-time
                  requestId:
                    type: string
                  SFCalculatorId:
                    type: string
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      required:
                        - code
                        - message
                      properties:
                        code:
                          type: string
                        message:
                          type: string
              example:
                receivedAt: "2026-06-30T15:01:00Z"
                requestId: req_123456
                SFCalculatorId: SF-12345
                errors:
                  - code: INVALID_PAYLOAD
                    message: One or more fields are invalid.
